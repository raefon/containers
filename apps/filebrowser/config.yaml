http:
  port: 80
server:
  database:
    path: /config/filebrowser/data/filebrowser.sqlite
  cacheDir: /config/filebrowser/data/tmp
  sources:
    - path: /storage
      name: Storage
      config:
        defaultEnabled: true
    - path: /config
      name: Config
      config:
        defaultEnabled: true
auth:
  methods:
    noauth: true
frontend:
  name: "KDLHOST: File Browser"
